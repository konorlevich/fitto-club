{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
{{template "head" .}}
</head>
<body>
<a class="skip" href="#main">{{.Copy.Common.SkipToContent}}</a>
{{template "header" .}}

{{template "content" .}}

</body>
</html>{{end}}
